<div class="auth-page">
  <mat-card>
    <mat-card-header><mat-icon>person_add</mat-icon><mat-card-title>Criar conta</mat-card-title><mat-card-subtitle>Confirme seu e-mail para ativar o acesso</mat-card-subtitle></mat-card-header>
    <mat-card-content>
      @if (message) { <p class="success">{{ message }}</p> } @else {
        <form [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline"><mat-label>E-mail</mat-label><input matInput formControlName="email" type="email" autocomplete="email"><mat-icon matSuffix>mail</mat-icon></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Senha</mat-label><input matInput formControlName="password" type="password" autocomplete="new-password"><mat-icon matSuffix>lock</mat-icon><mat-hint>8+ caracteres, maiúscula, minúscula e número.</mat-hint></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Confirmar senha</mat-label><input matInput formControlName="confirmPassword" type="password" autocomplete="new-password"><mat-icon matSuffix>lock</mat-icon></mat-form-field>
          @if (error) { <p class="error">{{ error }}</p> }
          <button mat-flat-button color="primary" type="submit" [disabled]="loading">{{ loading ? 'Criando...' : 'Criar conta' }}</button>
        </form>
      }
      <a routerLink="/login">Voltar para entrar</a>
    </mat-card-content>
  </mat-card>
</div>
