name: ClinicHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClinicHub.sln

      - name: Static analysis and formatting
        run: dotnet format ClinicHub.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ClinicHub.sln --configuration Release --no-restore

      - name: Test with coverage and quality gate
        shell: pwsh
        run: |
          dotnet test ClinicHub.sln --configuration Release --no-restore --collect "XPlat Code Coverage"
          ./scripts/Verify-Coverage.ps1 -MinimumLineRate 70

      - name: Publish coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/clinichub-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: frontend/clinichub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --watch=false

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose specification
        run: docker compose --env-file .env.example config --quiet

      - name: Build service images
        run: docker compose --env-file .env.example build
